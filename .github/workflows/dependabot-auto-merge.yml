name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Merge Dependabot pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! gh pr view "$PR_NUMBER" --json author,headRefOid |
            jq -e --arg sha "$HEAD_SHA" \
              '.author.login == "dependabot[bot]" and .headRefOid == $sha' \
              > /dev/null; then
            echo "Not a matching Dependabot pull request"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --squash
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Trigger release-please
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-please.yml --ref main
